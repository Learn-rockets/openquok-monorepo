# Build OpenQuok images for a Coolify deployment and push them to this fork's GHCR.
#
# Setup (fork → Settings → Secrets and variables → Actions):
#   Variables: VITE_FRONTEND_DOMAIN_URL, VITE_PUBLIC_SUPABASE_URL, VITE_PUBLIC_SUPABASE_PUBLISHABLE_KEY
#              (optional) VITE_PUBLIC_STRIPE_PUBLISHABLE_KEY, VITE_PUBLIC_POSTHOG_KEY, VITE_SUPPORT_EMAIL_ADDRESS, ...
#   Secrets (optional): COOLIFY_WEBHOOK, COOLIFY_TOKEN — triggers a Coolify redeploy after images are pushed.
#
# Images: ghcr.io/<owner>/openquok-{api,web,orchestrator}:latest and :<git sha>

name: Coolify images

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: coolify-images
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - image: openquok-api
            dockerfile: backend/Dockerfile
          - image: openquok-orchestrator
            dockerfile: orchestrator/Dockerfile
          - image: openquok-web
            dockerfile: web/Dockerfile
            web: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push
        env:
          IMAGE: ${{ matrix.image }}
          DOCKERFILE: ${{ matrix.dockerfile }}
          IS_WEB: ${{ matrix.web }}
          VITE_FRONTEND_DOMAIN_URL: ${{ vars.VITE_FRONTEND_DOMAIN_URL }}
          VITE_PUBLIC_SUPABASE_URL: ${{ vars.VITE_PUBLIC_SUPABASE_URL }}
          VITE_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          VITE_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ vars.VITE_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
          VITE_PUBLIC_STRIPE_PRICE_ID_SOLO_MONTHLY: ${{ vars.VITE_PUBLIC_STRIPE_PRICE_ID_SOLO_MONTHLY }}
          VITE_PUBLIC_STRIPE_PRICE_ID_SOLO_YEARLY: ${{ vars.VITE_PUBLIC_STRIPE_PRICE_ID_SOLO_YEARLY }}
          VITE_PUBLIC_STRIPE_PRICE_ID_TEAM_MONTHLY: ${{ vars.VITE_PUBLIC_STRIPE_PRICE_ID_TEAM_MONTHLY }}
          VITE_PUBLIC_STRIPE_PRICE_ID_TEAM_YEARLY: ${{ vars.VITE_PUBLIC_STRIPE_PRICE_ID_TEAM_YEARLY }}
          VITE_PUBLIC_STRIPE_PRICE_ID_ULTIMATE_MONTHLY: ${{ vars.VITE_PUBLIC_STRIPE_PRICE_ID_ULTIMATE_MONTHLY }}
          VITE_PUBLIC_STRIPE_PRICE_ID_ULTIMATE_YEARLY: ${{ vars.VITE_PUBLIC_STRIPE_PRICE_ID_ULTIMATE_YEARLY }}
          VITE_PUBLIC_STRIPE_PRICE_ID_MAX_MONTHLY: ${{ vars.VITE_PUBLIC_STRIPE_PRICE_ID_MAX_MONTHLY }}
          VITE_PUBLIC_STRIPE_PRICE_ID_MAX_YEARLY: ${{ vars.VITE_PUBLIC_STRIPE_PRICE_ID_MAX_YEARLY }}
          VITE_MEDIA_LIBRARY_UPLOAD: ${{ vars.VITE_MEDIA_LIBRARY_UPLOAD || 'local' }}
          VITE_STORAGE_R2_PUBLIC_BASE_URL: ${{ vars.VITE_STORAGE_R2_PUBLIC_BASE_URL }}
          VITE_SUPPORT_EMAIL_ADDRESS: ${{ vars.VITE_SUPPORT_EMAIL_ADDRESS }}
          VITE_PUBLIC_GOOGLE_ANALYTICS_MEASUREMENT_ID: ${{ vars.VITE_PUBLIC_GOOGLE_ANALYTICS_MEASUREMENT_ID }}
          VITE_PUBLIC_POSTHOG_KEY: ${{ vars.VITE_PUBLIC_POSTHOG_KEY }}
          VITE_PUBLIC_POSTHOG_HOST: ${{ vars.VITE_PUBLIC_POSTHOG_HOST || 'https://us.i.posthog.com' }}
          VITE_PUBLIC_FACEBOOK_PIXEL: ${{ vars.VITE_PUBLIC_FACEBOOK_PIXEL }}
        run: |
          set -euo pipefail
          owner="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          base="ghcr.io/${owner}/${IMAGE}"

          args=()
          if [[ "${IS_WEB}" == "true" ]]; then
            if [[ -z "${VITE_FRONTEND_DOMAIN_URL}" || -z "${VITE_PUBLIC_SUPABASE_URL}" || -z "${VITE_PUBLIC_SUPABASE_PUBLISHABLE_KEY}" ]]; then
              echo "Set repo variables VITE_FRONTEND_DOMAIN_URL, VITE_PUBLIC_SUPABASE_URL, VITE_PUBLIC_SUPABASE_PUBLISHABLE_KEY" >&2
              exit 1
            fi
            # Empty = same-origin /api (web container proxies to the api service).
            args+=(--build-arg "VITE_API_BASE_URL=")
            for name in $(env | grep -o '^VITE_[A-Z0-9_]*' | sort -u); do
              args+=(--build-arg "${name}=${!name}")
            done
          fi

          docker buildx build --platform linux/amd64 \
            -f "${DOCKERFILE}" \
            -t "${base}:latest" \
            -t "${base}:${GITHUB_SHA}" \
            "${args[@]}" \
            --provenance=false --sbom=false \
            --cache-from type=gha,scope="${IMAGE}" \
            --cache-to type=gha,mode=max,scope="${IMAGE}" \
            --push \
            .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Coolify redeploy
        env:
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          if [[ -z "${COOLIFY_WEBHOOK}" || -z "${COOLIFY_TOKEN}" ]]; then
            echo "COOLIFY_WEBHOOK / COOLIFY_TOKEN not set; redeploy from the Coolify UI."
            exit 0
          fi
          curl -fsS --request GET "${COOLIFY_WEBHOOK}" --header "Authorization: Bearer ${COOLIFY_TOKEN}"
